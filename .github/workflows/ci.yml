name: build-and-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure

  cuda-compile:
    # Compile and link the CUDA path for Titan RTX/Turing. Hosted runners have no
    # GPU: this job must never be presented as a GPU runtime test.
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends git cmake build-essential python3 python3-numpy
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTIDAL_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75 -DGGML_NATIVE=OFF
      - run: cmake --build build -j 2
      - run: ctest --test-dir build --output-on-failure
